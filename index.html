    <script>
      // Safe guard for HMR WebSockets in proxy container environments
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes?.('WebSocket') || e.filename?.includes?.('@vite/client'))) {
          e.preventDefault?.();
          e.stopImmediatePropagation?.();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && (String(e.reason).includes('WebSocket') || e.reason?.message?.includes?.('WebSocket'))) {
          e.preventDefault?.();
          e.stopImmediatePropagation?.();
        }
      }, true);
    </script>
